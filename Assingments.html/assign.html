<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Word Filter</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #f5f3ff,
                #e9e4ff
            );

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        /* MAIN CARD */

        .filter-card {

            background: white;

            width: 100%;

            max-width: 500px;

            padding: 40px;

            border-radius: 24px;

            box-shadow: 0 20px 60px rgba(70, 50, 150, 0.12);

        }


        /* ICON */

        .icon {

            width: 60px;

            height: 60px;

            background: #eee9ff;

            border-radius: 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;

            margin-bottom: 20px;

        }


        /* HEADING */

        h1 {

            font-size: 32px;

            color: #24134f;

            margin-bottom: 10px;

        }

        .subtitle {

            color: #777;

            font-size: 15px;

            margin-bottom: 30px;

        }


        /* LABEL */

        label {

            display: block;

            font-size: 14px;

            font-weight: bold;

            color: #333;

            margin-bottom: 10px;

        }


        /* TEXTAREA */

        textarea {

            width: 100%;

            height: 140px;

            padding: 16px;

            border: 1px solid #ddd;

            border-radius: 14px;

            resize: none;

            font-size: 15px;

            font-family: inherit;

            outline: none;

            transition: 0.3s;

        }

        textarea:focus {

            border-color: #7654e8;

            box-shadow: 0 0 0 3px #7654e820;

        }

        textarea::placeholder {

            color: #aaa;

        }


        /* BUTTON */

        button {

            width: 100%;

            margin-top: 18px;

            padding: 16px;

            border: none;

            border-radius: 12px;

            background: #7654e8;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

        }

        button:hover {

            background: #5d3bc9;

            transform: translateY(-2px);

        }


        /* RESULT BOX */

        .result-box {

            background: #f8f7fc;

            border-radius: 14px;

            padding: 20px;

            margin-top: 25px;

            min-height: 100px;

        }

        .result-box h3 {

            font-size: 14px;

            color: #7654e8;

            margin-bottom: 12px;

        }

        .result-box p {

            color: #555;

            font-size: 15px;

            line-height: 1.6;

            word-wrap: break-word;

        }


        /* RESPONSIVE */

        @media (max-width: 500px) {

            .filter-card {

                padding: 28px 22px;

            }

            h1 {

                font-size: 27px;

            }

        }

    </style>

</head>


<body>

    <main>

        <div class="filter-card">

            <div class="icon">
                🛡️
            </div>

            <h1>Word Filter</h1>

            <p class="subtitle">
                Keep your words clean and respectful.
            </p>

            <label for="field">
                Enter your text
            </label>

            <textarea
                id="field"
                placeholder="Type a sentence here..."
            ></textarea>

            <button onclick="filterWords()">

                Filter Words →

            </button>

            <div class="result-box">

                <h3>Filtered Result</h3>

                <p id="result">

                    Your filtered text will appear here...

                </p>

            </div>

        </div>

    </main>


    <script>
          function filterWords() {

    let info = document.getElementById('field').value;

    let result = info
        .replaceAll('stupid', "******")   
        .replaceAll('fuck', "****")
        .replaceAll('dumb', "****")
        .replaceAll('shit', "****")
        .replaceAll('bastard', "*******")
        .replaceAll('shibal', "******");  

    document.getElementById('result').innerHTML = result;

}

    </script>


</body>

</html>
