<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #f8eaff, #e8f0ff);
        font-family: Arial, sans-serif;
    }

    .todo-container {
        width: 90%;
        max-width: 500px;
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
    }

    .input-area {
        display: flex;
        gap: 10px;
    }

    #todo {
        flex: 1;
        padding: 14px 16px;
        border: 2px solid #ddd;
        border-radius: 10px;
        outline: none;
        font-size: 15px;
        transition: 0.3s;
    }

    #todo:focus {
        border-color: #8b5cf6;
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }

    button {
        border: none;
        cursor: pointer;
        transition: 0.3s;
    }

    .add-btn {
        padding: 14px 22px;
        background: #8b5cf6;
        color: white;
        border-radius: 10px;
        font-size: 15px;
        font-weight: bold;
    }

    .add-btn:hover {
        background: #7c3aed;
        transform: translateY(-2px);
    }

    #output {
        margin-top: 25px;
    }

    .todo-item {
        background: #f8f7ff;
        margin-bottom: 10px;
        padding: 14px 16px;
        border-radius: 10px;
        border-left: 4px solid #8b5cf6;
        color: #333;
        font-size: 16px;
    }
</style>
</style>
<body>
    <!-- Daily Assignment [28-09-2026]
    Create Todo list with an input form.
    Read on Functions -->
       

   <div class="todo-container">

    <h1>My Todo List 📝</h1>

    <div class="input-area">
        <input type="text" id="todo" placeholder="Enter your to-do">

        <button class="add-btn" onclick="addtodo()">Add</button>
    </div>

    <p id="output"></p>

</div>

</body>

<script>
    let store = []

function addtodo (){
      
       let todo = document.getElementById('todo').value.trim()

        if(todo=== ''){
        alert('Please enter a todo');
        return;
    }

    store.push(todo);

    displayOutput();
}

function displayOutput() {

    output.innerHTML = '';

    for(let i = 0; i < store.length; i++){

        output.innerHTML += `<div class="todo-item">${store[i]}</div>`;

    }
}

</script>
</html>
