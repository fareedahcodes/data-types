<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>

    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

.container {
    width: 90%;
    max-width: 1100px;
    margin: 50px auto;
    text-align: center;
}

h1 {
    font-size: 40px;
    margin-bottom: 10px;
}

.subtitle {
    color: #777;
    margin-bottom: 30px;
}

.search-box {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 40px;
}

.search-box input {
    width: 400px;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

.search-box input:focus {
    border-color: #222;
}

.search-box button {
    padding: 15px 25px;
    border: none;
    border-radius: 8px;
    background: #222;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.search-box button:hover {
    background: #444;
}

.products {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    text-align: left;
}

.product-card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
}

.product-card h3 {
    margin-bottom: 10px;
}

.product-card p {
    margin: 8px 0;
    color: #666;
}

.price {
    font-size: 20px;
    font-weight: bold;
    color: #222;
}

@media (max-width: 700px) {

    .products {
        grid-template-columns: 1fr;
    }

    .search-box {
        flex-direction: column;
    }

    .search-box input {
        width: 100%;
    }
}

</style>
<body>
    
   <div class="container">

    <h1>🛍️ Product Finder</h1>
    <p class="subtitle">Search for products by name or category</p>

    <div class="search-box">
        <input type="text" id="input" placeholder="Search for products...">
        <button onclick="checkProducts()">Search</button>
    </div>

    <div id="display" class="products"></div>

</div>

</body>
